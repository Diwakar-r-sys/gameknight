<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mossgrotto — Hollow Combat Sandbox (10-Level Multi-Stage System)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040b0e;
      color: #e6f4ef;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(6, 18, 21, 0.84);
      border: 1px solid #264943;
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 280px;
    }
    .hud-title { font-weight: 700; font-size: 14px; color: #eef7f3; }
    .hud-sub { font-size: 12px; color: #95d5b2; }
    .hud-active { font-size: 12px; color: #83a69b; }
    .hud-active strong { color: #fde047; }
    .bar { height: 6px; background: #0a1f22; border-radius: 999px; overflow: hidden; border: 1px solid #1e3d38; }
    .bar-fill { height: 100%; background: #52b788; transition: width 0.15s ease; }
    .controls {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      background: rgba(6, 18, 21, 0.8);
      border: 1px solid #1e3d38;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 11px;
      color: #9ec2b6;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="hud-title" id="hudLevel">Level 1: Beginner Knight</div>
    <div class="bar"><div class="bar-fill" id="hudXpBar" style="width: 0%"></div></div>
    <div class="hud-sub" id="hudSoul">Soul: 60 / 100 · XP: 0</div>
    <div class="hud-active">Active Attack: <strong id="hudAttack">Level 1 Basic Horizontal Slash</strong></div>
  </div>
  <div class="controls">
    A/D Move · Space Jump · J/X/Click Slash (W/S Aim) · K/Shift Dash · V/Right-Click Special · Keys 1-9,0 Set Level
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const hudLevel = document.getElementById('hudLevel');
      const hudXpBar = document.getElementById('hudXpBar');
      const hudSoul = document.getElementById('hudSoul');
      const hudAttack = document.getElementById('hudAttack');

      const LEVELS = [
        { level: 1, title: 'Beginner Knight', xp: 0, art: 'Basic Horizontal Slash' },
        { level: 2, title: 'Warrior', xp: 25, art: 'Warrior Slash' },
        { level: 3, title: 'Quick Knight', xp: 60, art: 'Dash Slash & Air Slash' },
        { level: 4, title: 'Wall Climber', xp: 110, art: 'Swift Air Cleave' },
        { level: 5, title: 'Double Jumper', xp: 175, art: 'Downward Pogo' },
        { level: 6, title: 'Energy Master', xp: 255, art: 'Energy Projectile' },
        { level: 7, title: 'Shadow Warrior', xp: 350, art: 'Shadow Dash Attack' },
        { level: 8, title: 'Soul Master', xp: 460, art: 'Strong AoE Magic Spell' },
        { level: 9, title: 'Ancient Knight', xp: 590, art: 'Multi-Hit Combo' },
        { level: 10, title: 'Ultimate Knight', xp: 750, art: 'Ultimate Slash Wave' },
      ];

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function circleIntersectsRect(cx, cy, r, rect) {
        const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
        const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
        const dx = cx - nx;
        const dy = cy - ny;
        return dx * dx + dy * dy <= r * r;
      }

      class PlayerCombat {
        constructor() {
          this.attackCooldown = 0;
          this.specialCooldown = 0;
          this.comboStep = 0;
          this.comboReset = 0;
          this.dashWindow = 0;
          this.activeName = 'Basic Horizontal Slash';
          this.activeLevel = 1;
          this.displayHold = 0;
          this.shadowHitIds = new Set();
          this.slash = {
            active: false, x: 0, y: 0, dir: 'right',
            timer: 0, duration: 0.15, frame: 0,
            kind: 'basicHorizontal', damage: 14, radius: 44,
            hitIds: new Set()
          };
          this.waves = [];
          this.aoeRings = [];
        }

        getDefaultForLevel(level) {
          if (level >= 10) return { name: 'Ultimate Slash Wave', level: 10 };
          if (level >= 9) return { name: 'Multi-Hit Combo', level: 9 };
          if (level >= 8) return { name: 'AoE Magic Spell', level: 8 };
          if (level >= 7) return { name: 'Shadow Dash Attack', level: 7 };
          if (level >= 6) return { name: 'Energy Projectile', level: 6 };
          if (level >= 5) return { name: 'Downward Pogo', level: 5 };
          if (level >= 4) return { name: 'Swift Air Cleave', level: 4 };
          if (level >= 3) return { name: 'Dash Slash', level: 3 };
          if (level >= 2) return { name: 'Warrior Slash', level: 2 };
          return { name: 'Basic Horizontal Slash', level: 1 };
        }

        update(dt, isDashing, level) {
          this.attackCooldown = Math.max(0, this.attackCooldown - dt);
          this.specialCooldown = Math.max(0, this.specialCooldown - dt);
          if (this.comboReset > 0) {
            this.comboReset -= dt;
            if (this.comboReset <= 0) this.comboStep = 0;
          }
          if (isDashing) this.dashWindow = 0.22;
          else this.dashWindow = Math.max(0, this.dashWindow - dt);

          if (this.displayHold > 0) {
            this.displayHold -= dt;
          }
          if (this.displayHold <= 0) {
            const d = this.getDefaultForLevel(level);
            this.activeName = d.name;
            this.activeLevel = d.level;
          }

          for (const r of this.aoeRings) {
            if (!r.active) continue;
            r.life -= dt;
            const p = 1 - Math.max(0, r.life / r.maxLife);
            r.radius = 20 + (r.maxRadius - 20) * (1 - Math.pow(1 - p, 2.2));
            if (r.life <= 0) r.active = false;
          }
          this.aoeRings = this.aoeRings.filter((r) => r.active);
        }

        triggerPrimary(level, facing, grounded, dashing, upHeld, downHeld) {
          if (this.attackCooldown > 0) return null;
          let dir = facing === 1 ? 'right' : 'left';
          if (upHeld) dir = 'up';
          else if (downHeld && !grounded) dir = 'down';

          const isDash = dashing || this.dashWindow > 0;
          let kind = 'basicHorizontal';
          let req = 1;
          let name = dir === 'up' ? 'Upward Slash' : dir === 'down' ? 'Downward Air Slash' : 'Basic Horizontal Slash';
          let damage = 14;
          let radius = 44;
          let duration = 0.145;
          let lungeVx = 0;

          if (dir === 'down') {
            kind = 'downPogo'; req = level >= 5 ? 5 : 1; name = level >= 5 ? 'Downward Pogo' : 'Downward Air Slash'; damage = level >= 5 ? 18 : 14; radius = level >= 5 ? 46 : 42;
          } else if (level >= 7 && isDash) {
            kind = 'shadowDashAttack'; req = 7; name = 'Shadow Dash Attack'; damage = 28; radius = 60; lungeVx = facing * 240;
          } else if (level >= 3 && isDash) {
            kind = 'dashSlash'; req = 3; name = 'Dash Slash'; damage = 22; radius = 56; lungeVx = facing * 180;
          } else if (level >= 9) {
            this.comboStep = this.comboReset > 0 ? (this.comboStep + 1) % 3 : 0;
            this.comboReset = 0.9;
            if (this.comboStep === 0) { kind = 'comboHit1'; req = 9; name = dir === 'up' ? 'Combo Up-Slash I' : 'Combo Slash I'; damage = 20; radius = 50; }
            else if (this.comboStep === 1) { kind = 'comboHit2'; req = 9; name = dir === 'up' ? 'Combo Up-Slash II' : 'Combo Slash II'; damage = 24; radius = 54; }
            else { kind = 'comboFinisher'; req = 9; name = dir === 'up' ? 'Multi-Hit Up-Combo III' : 'Multi-Hit Combo III'; damage = 36; radius = 64; duration = 0.18; }
          } else if (!grounded && level >= 3) {
            kind = 'airSlash'; req = level >= 4 ? 4 : 3; name = level >= 4 ? 'Swift Air Cleave' : 'Air Slash'; damage = 19; radius = 48;
          } else if (level >= 2) {
            kind = 'warriorSlash'; req = 2; name = dir === 'up' ? 'Warrior Up-Slash' : 'Warrior Slash'; damage = 18; radius = 46;
          }

          this.attackCooldown = level >= 4 ? 0.2 : 0.24;
          Object.assign(this.slash, {
            active: true, dir, duration, timer: duration, frame: 0,
            kind, damage, radius, hitIds: new Set()
          });
          this.activeName = name;
          this.activeLevel = req;
          this.displayHold = 1.6;
          return { lungeVx };
        }

        triggerSpecial(level, facing, pcx, pcy) {
          if (level < 6 || this.specialCooldown > 0) return null;
          const isUltimate = level >= 10;
          const hasNova = level >= 8;
          this.specialCooldown = 0.55;
          this.activeName = isUltimate ? 'Ultimate Slash Wave' : hasNova ? 'Strong AoE Magic Spell' : 'Energy Projectile';
          this.activeLevel = isUltimate ? 10 : hasNova ? 8 : 6;
          this.displayHold = 2.0;

          const color = isUltimate ? '#fde047' : hasNova ? '#38bdf8' : '#67e8f9';
          if (hasNova) {
            this.aoeRings.push({
              active: true, x: pcx, y: pcy, radius: 20,
              maxRadius: isUltimate ? 180 : 132,
              life: isUltimate ? 0.42 : 0.32, maxLife: isUltimate ? 0.42 : 0.32,
              color, isUltimate
            });
          }

          const dirs = isUltimate ? [facing, -facing] : [facing];
          for (const d of dirs) {
            this.waves.push({
              active: true, x: pcx + d * 24, y: pcy, vx: d * (isUltimate ? 820 : 650),
              facing: d, life: isUltimate ? 1.3 : 0.9, maxLife: isUltimate ? 1.3 : 0.9,
              damage: isUltimate ? 48 : 26, isUltimate,
              halfW: isUltimate ? 46 : 24, halfH: isUltimate ? 110 : 34,
              color, hitIds: new Set()
            });
          }
          return {
            hasNova,
            novaRadius: isUltimate ? 180 : 132,
            novaDamage: isUltimate ? 65 : 40,
            isUltimate,
            color
          };
        }

        stepSlashFrame() {
          const p = 1 - Math.max(0, this.slash.timer / Math.max(0.001, this.slash.duration));
          this.slash.frame = p < 0.33 ? 0 : p < 0.68 ? 1 : 2;
        }

        getHitbox() {
          const { x, y, dir, radius } = this.slash;
          const reach = radius + 24;
          const breadth = Math.round(radius * 1.6);
          if (dir === 'right') return { x: x - 6, y: y - breadth * 0.5, w: reach, h: breadth };
          if (dir === 'left') return { x: x - reach + 6, y: y - breadth * 0.5, w: reach, h: breadth };
          if (dir === 'up') return { x: x - breadth * 0.5, y: y - reach + 6, w: breadth, h: reach };
          return { x: x - breadth * 0.5, y: y - 6, w: breadth, h: reach };
        }
      }

      const combat = new PlayerCombat();
      const held = new Set();
      const pressed = new Set();

      const player = {
        x: 240, y: 300, w: 28, h: 46, vx: 0, vy: 0,
        facing: 1, grounded: false, level: 1, xp: 0, soul: 60,
        dashTimer: 0, dashCooldown: 0, recoilTimer: 0, airJumps: 1, invuln: 0
      };

      let hitStopTimer = 0; // Frame-counted hit-stop freeze (e.g., hitStopTimer = 3 frames)
      let shakeTime = 0;
      let shakeMag = 0;
      const particles = [];
      const floatingTexts = [];
      let enemies = [];

      // Step 2: Web Audio Impact Hook (sharp whack/slash on first collision frame)
      let audioCtx = null;
      function playImpactSfx(heavy) {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            audioCtx = new Ctx();
          }
          if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
          const t = audioCtx.currentTime;

          // Low punch body
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(heavy ? 310 : 250, t);
          osc.frequency.exponentialRampToValueAtTime(75, t + (heavy ? 0.11 : 0.08));
          gain.gain.setValueAtTime(heavy ? 0.22 : 0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + (heavy ? 0.11 : 0.08));
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.12);

          // Crisp transient whack snap
          const len = Math.floor(audioCtx.sampleRate * 0.045);
          const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.3));
          }
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          const bp = audioCtx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(heavy ? 1850 : 1450, t);
          bp.Q.setValueAtTime(1.1, t);
          const nGain = audioCtx.createGain();
          nGain.gain.setValueAtTime(heavy ? 0.26 : 0.18, t);
          nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
          src.connect(bp);
          bp.connect(nGain);
          nGain.connect(audioCtx.destination);
          src.start(t);
        } catch {
          // Audio blocked or unavailable
        }
      }

      function spawnEnemies(floorY) {
        enemies = [
          { id: 'e1', kind: 'crawler', x: 500, y: floorY - 34, homeX: 500, homeY: floorY - 34, w: 38, h: 34, vx: 70, vy: 0, knockVx: 0, knockVy: 0, knockTimer: 0, hp: 60, maxHp: 60, facing: 1, hitFlashFrames: 0, alive: true, respawn: 0 },
          { id: 'e2', kind: 'shieldbearer', x: 740, y: floorY - 54, homeX: 740, homeY: floorY - 54, w: 46, h: 54, vx: -50, vy: 0, knockVx: 0, knockVy: 0, knockTimer: 0, hp: 110, maxHp: 110, facing: -1, hitFlashFrames: 0, alive: true, respawn: 0 },
          { id: 'e3', kind: 'flyer', x: 930, y: floorY - 145, homeX: 930, homeY: floorY - 145, w: 38, h: 36, vx: 0, vy: 0, knockVx: 0, knockVy: 0, knockTimer: 0, hp: 85, maxHp: 85, facing: -1, hitFlashFrames: 0, alive: true, respawn: 0, flyer: true },
          { id: 'boss', kind: 'warden', x: Math.max(980, canvas.width - 210), y: floorY - 96, homeX: Math.max(980, canvas.width - 210), homeY: floorY - 96, w: 68, h: 92, vx: 0, vy: 0, knockVx: 0, knockVy: 0, knockTimer: 0, hp: 220, maxHp: 220, facing: -1, hitFlashFrames: 0, alive: true, respawn: 0 },
        ];
      }

      function computeHitPoint(originX, originY, rect) {
        return {
          x: Math.max(rect.x, Math.min(originX, rect.x + rect.w)),
          y: Math.max(rect.y, Math.min(originY, rect.y + rect.h)),
        };
      }

      function spawnBurst(x, y, count, color, speed) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = speed * (0.35 + Math.random() * 0.75);
          particles.push({
            x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 40,
            size: 2 + Math.random() * 3, life: 0.35, maxLife: 0.35, color, glow: false
          });
        }
      }

      function spawnDirectionalBlast(x, y, dirX, dirY, count, color, speed) {
        const baseAngle = Math.atan2(dirY, dirX);
        for (let i = 0; i < count; i++) {
          const ang = baseAngle + (Math.random() - 0.5) * 1.25;
          const spd = speed * (0.45 + Math.random() * 0.78);
          const isCore = i % 3 === 0;
          particles.push({
            x: x + (Math.random() - 0.5) * 6,
            y: y + (Math.random() - 0.5) * 6,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 28,
            size: isCore ? 2.5 + Math.random() * 2.2 : 3 + Math.random() * 2.5,
            life: 0.25 + Math.random() * 0.18,
            maxLife: 0.42,
            color: isCore ? '#ffffff' : color,
            glow: true
          });
        }
      }

      function addFloat(x, y, text, color) {
        floatingTexts.push({ x, y, vy: -55, text, color, life: 0.75, maxLife: 0.75 });
      }

      function triggerShake(mag, dur) {
        shakeMag = Math.max(shakeMag, mag);
        shakeTime = Math.max(shakeTime, dur);
      }

      // Reusable 5-Step Combat Juice & Attack Feedback Handler
      function triggerAttackJuice(enemy, hitPoint, attackVec = { x: player.facing, y: 0 }, options = {}) {
        const heavy = Boolean(options.heavy);
        const sparkColor = options.sparkColor || '#fef08a';
        const len = Math.hypot(attackVec.x, attackVec.y);
        const dirX = len > 0.001 ? attackVec.x / len : player.facing;
        const dirY = len > 0.001 ? attackVec.y / len : 0;

        // Step 1: Flash Effect (solid stark white #ffffff for 3 to 4 frames)
        enemy.hitFlashFrames = 4;

        // Step 2: Impact Audio Trigger Hook on exact first impact frame
        playImpactSfx(heavy);

        // Step 3: Particle Blast (10 to 15 glowing sparks/dust at hitPoint along attack vector)
        spawnDirectionalBlast(hitPoint.x, hitPoint.y, dirX, dirY, heavy ? 15 : 12, sparkColor, heavy ? 330 : 270);

        // Step 4: Knockback Physics (enemy separation across all types + player recoil)
        const pcx = player.x + player.w * 0.5;
        const ecx = enemy.x + enemy.w * 0.5;
        const knockDirX = Math.abs(dirX) > 0.25 ? Math.sign(dirX) : (pcx < ecx ? 1 : -1);

        if (enemy.kind === 'crawler') {
          enemy.knockVx = knockDirX * (heavy ? 260 : 205);
          enemy.knockVy = 0;
          enemy.knockTimer = 0.16;
        } else if (enemy.kind === 'flyer') {
          enemy.knockVx = knockDirX * (heavy ? 275 : 215);
          enemy.knockVy = dirY * 130 - 65;
          enemy.knockTimer = 0.18;
        } else if (enemy.kind === 'shieldbearer') {
          enemy.knockVx = knockDirX * (heavy ? 190 : 145);
          enemy.knockVy = 0;
          enemy.knockTimer = 0.14;
        } else {
          enemy.knockVx = knockDirX * (heavy ? 150 : 105);
          enemy.knockVy = dirY < -0.2 ? -65 : -30;
          enemy.knockTimer = 0.12;
        }

        if (options.applyPlayerRecoil && player.dashTimer <= 0) {
          player.vx = -knockDirX * (heavy ? 215 : 185);
          player.recoilTimer = 0.085;
        }

        // Step 5: Screen Shake & Hit-Stop (2 to 3 frames freeze + camera vibration)
        hitStopTimer = Math.max(hitStopTimer, 3);
        const shakeAmt = heavy ? 8 : enemy.kind === 'warden' ? 7 : enemy.kind === 'shieldbearer' ? 5.8 : 4.8;
        triggerShake(shakeAmt, 0.17);
      }

      function hitEnemy(enemy, damage, color, hitPoint, attackVec, heavy = false, applyPlayerRecoil = false) {
        const pcx = player.x + player.w * 0.5;
        const pcy = player.y + player.h * 0.5;
        const ecx = enemy.x + enemy.w * 0.5;
        const ecy = enemy.y + enemy.h * 0.5;
        const resolvedHit = hitPoint || computeHitPoint(pcx, pcy, enemy);
        const resolvedVec = attackVec || { x: ecx - pcx, y: ecy - pcy };

        enemy.hp = Math.max(0, enemy.hp - damage);
        player.soul = Math.min(100, player.soul + 14);
        triggerAttackJuice(enemy, resolvedHit, resolvedVec, {
          heavy: heavy || damage >= 30,
          sparkColor: color,
          applyPlayerRecoil,
        });
        addFloat(resolvedHit.x, enemy.y - 10, `-${damage}`, color);

        if (enemy.hp <= 0) {
          enemy.alive = false;
          enemy.respawn = 2.4;
          hitStopTimer = Math.max(hitStopTimer, enemy.kind === 'warden' ? 4 : 3);
          triggerShake(enemy.kind === 'warden' ? 11 : 7, 0.24);
          spawnBurst(ecx, ecy, enemy.kind === 'warden' ? 38 : 26, '#6ee7b7', 310);
          player.xp += enemy.kind === 'warden' ? 100 : enemy.kind === 'shieldbearer' ? 60 : 35;
          for (const tier of LEVELS) {
            if (player.xp >= tier.xp && tier.level > player.level) {
              player.level = tier.level;
              addFloat(player.x + 14, player.y - 24, `LEVEL ${tier.level}!`, '#fde047');
            }
          }
        }
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if (enemies.length === 0) spawnEnemies(canvas.height - 110);
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('keydown', (e) => {
        if (!held.has(e.code)) pressed.add(e.code);
        held.add(e.code);
        if (e.code.startsWith('Digit')) {
          const n = e.code === 'Digit0' ? 10 : Number(e.code.replace('Digit', ''));
          if (n >= 1 && n <= 10) {
            player.level = n;
            player.xp = LEVELS[n - 1].xp;
            addFloat(player.x + 14, player.y - 20, `LEVEL ${n}: ${LEVELS[n - 1].art}`, '#fde047');
          }
        }
      });
      window.addEventListener('keyup', (e) => held.delete(e.code));
      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) pressed.add('MouseLeft');
        if (e.button === 2) pressed.add('MouseRight');
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        const floorY = canvas.height - 110;
        const spikes = { x: 350, y: floorY - 22, w: 110, h: 22 };

        if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);

        if (hitStopTimer > 0) {
          // Freeze game physics, movement, and animations for 2 to 3 frames
          hitStopTimer = Math.max(0, hitStopTimer - 1);
        } else {
          combat.update(dt, player.dashTimer > 0, player.level);

          const left = held.has('KeyA') || held.has('ArrowLeft');
          const right = held.has('KeyD') || held.has('ArrowRight');
          const moveX = left && !right ? -1 : right && !left ? 1 : 0;
          const upHeld = held.has('KeyW') || held.has('ArrowUp');
          const downHeld = held.has('KeyS') || held.has('ArrowDown');

          if (player.recoilTimer > 0) player.recoilTimer = Math.max(0, player.recoilTimer - dt);
          if (moveX !== 0 && player.dashTimer <= 0 && !player.recoilTimer) player.facing = moveX;
          if (player.dashCooldown > 0) player.dashCooldown -= dt;

          if ((pressed.has('KeyK') || pressed.has('ShiftLeft')) && player.level >= 3 && player.dashCooldown <= 0) {
            player.dashTimer = 0.16;
            player.dashCooldown = 0.4;
            combat.dashWindow = 0.25;
            combat.shadowHitIds.clear();
            player.vx = player.facing * 860;
            player.vy = 0;
            spawnBurst(player.x + 14, player.y + 23, 14, player.level >= 7 ? '#c084fc' : '#67e8f9', 220);
          }

          if (player.dashTimer > 0) {
            player.dashTimer -= dt;
            player.vx = player.facing * 860;
            player.vy = 0;
            if (player.level >= 7) {
              for (const en of enemies) {
                if (!en.alive || combat.shadowHitIds.has(en.id)) continue;
                if (rectsOverlap({ x: player.x - 8, y: player.y, w: player.w + 16, h: player.h }, en)) {
                  combat.shadowHitIds.add(en.id);
                  const hp = computeHitPoint(player.x + 14, player.y + 23, en);
                  hitEnemy(en, 26, '#c084fc', hp, { x: player.facing, y: 0 }, true, false);
                  addFloat(en.x + 18, en.y - 26, 'SHADOW CLEAVE!', '#c084fc');
                }
              }
            }
          } else {
            if (!player.recoilTimer) {
              player.vx = moveX * 360;
            }
            player.vy = Math.min(780, player.vy + 1800 * dt);
          }

          if (pressed.has('Space') || pressed.has('KeyZ')) {
            if (player.grounded) {
              player.vy = -640;
              player.grounded = false;
            } else if (player.level >= 5 && player.airJumps > 0) {
              player.airJumps -= 1;
              player.vy = -590;
              spawnBurst(player.x + 14, player.y + 40, 14, '#a7f3d0', 180);
            }
          }

          if (pressed.has('KeyV') || pressed.has('MouseRight')) {
            const sp = combat.triggerSpecial(player.level, player.facing, player.x + 14, player.y + 23);
            if (sp) {
              triggerShake(sp.isUltimate ? 10 : 6.5, 0.22);
              if (sp.hasNova) {
                spawnBurst(player.x + 14, player.y + 23, sp.isUltimate ? 42 : 28, sp.color, 300);
                for (const en of enemies) {
                  if (en.alive && circleIntersectsRect(player.x + 14, player.y + 23, sp.novaRadius, en)) {
                    const hp = computeHitPoint(player.x + 14, player.y + 23, en);
                    const dx = (en.x + en.w * 0.5) - (player.x + 14);
                    const dy = (en.y + en.h * 0.5) - (player.y + 23);
                    hitEnemy(en, sp.novaDamage, sp.color, hp, { x: dx, y: dy }, sp.isUltimate, false);
                  }
                }
              }
            }
          } else if (pressed.has('KeyJ') || pressed.has('KeyX') || pressed.has('MouseLeft')) {
            const res = combat.triggerPrimary(player.level, player.facing, player.grounded, player.dashTimer > 0, upHeld, downHeld);
            if (res && res.lungeVx !== 0 && player.dashTimer <= 0) player.vx = res.lungeVx;
          }

          player.x = Math.max(20, Math.min(canvas.width - 48, player.x + player.vx * dt));
          player.y += player.vy * dt;
          if (player.y + player.h >= floorY) {
            player.y = floorY - player.h;
            player.vy = 0;
            player.grounded = true;
            player.airJumps = 1;
          } else {
            player.grounded = false;
          }

          // Update Slash
          if (combat.slash.active) {
            combat.slash.timer -= dt;
            combat.stepSlashFrame();
            const pcx = player.x + 14, pcy = player.y + 23;
            combat.slash.x = pcx + (combat.slash.dir === 'right' ? 14 : combat.slash.dir === 'left' ? -14 : 0);
            combat.slash.y = pcy + (combat.slash.dir === 'down' ? 16 : combat.slash.dir === 'up' ? -16 : 0);
            const hb = combat.getHitbox();
            const slashVec =
              combat.slash.dir === 'right' ? { x: 1, y: 0 }
                : combat.slash.dir === 'left' ? { x: -1, y: 0 }
                : combat.slash.dir === 'up' ? { x: 0, y: -1 }
                : { x: 0, y: 1 };
            const heavySlash = combat.slash.kind === 'comboFinisher' || combat.slash.kind === 'dashSlash' || combat.slash.kind === 'shadowDashAttack';
            let pogo = false;
            for (const en of enemies) {
              if (en.alive && !combat.slash.hitIds.has(en.id) && rectsOverlap(hb, en)) {
                combat.slash.hitIds.add(en.id);
                const hp = computeHitPoint(combat.slash.x + slashVec.x * 16, combat.slash.y + slashVec.y * 16, en);
                hitEnemy(
                  en,
                  combat.slash.damage,
                  combat.slash.kind === 'comboFinisher' ? '#fde047' : '#fef08a',
                  hp,
                  slashVec,
                  heavySlash,
                  combat.slash.dir === 'right' || combat.slash.dir === 'left'
                );
                if (combat.slash.dir === 'down') pogo = true;
              }
            }
            if (combat.slash.dir === 'down' && !combat.slash.hitIds.has('spikes') && rectsOverlap(hb, spikes)) {
              combat.slash.hitIds.add('spikes');
              pogo = true;
              playImpactSfx(false);
              spawnDirectionalBlast(player.x + 14, spikes.y, 0, -1, 12, '#e9d5ff', 220);
            }
            if (pogo) {
              player.vy = -600;
              player.airJumps = 1;
              hitStopTimer = Math.max(hitStopTimer, 3);
              triggerShake(4.5, 0.14);
            }
            if (combat.slash.timer <= 0) combat.slash.active = false;
          }

          // Update Waves
          for (const w of combat.waves) {
            if (!w.active) continue;
            w.life -= dt;
            w.x += w.vx * dt;
            if (w.life <= 0) { w.active = false; continue; }
            const box = { x: w.x - w.halfW, y: w.y - w.halfH, w: w.halfW * 2, h: w.halfH * 2 };
            for (const en of enemies) {
              if (en.alive && !w.hitIds.has(en.id) && rectsOverlap(box, en)) {
                w.hitIds.add(en.id);
                const hp = computeHitPoint(w.x, w.y, en);
                hitEnemy(en, w.damage, w.color, hp, { x: w.facing, y: 0 }, w.isUltimate, false);
              }
            }
          }
          combat.waves = combat.waves.filter((w) => w.active);

          // Update Enemies (including knockback physics across all types)
          for (const en of enemies) {
            if (!en.alive) {
              en.respawn -= dt;
              if (en.respawn <= 0) {
                en.alive = true;
                en.hp = en.maxHp;
                en.x = en.homeX;
                en.y = en.homeY;
                en.knockVx = 0;
                en.knockVy = 0;
                en.knockTimer = 0;
                en.hitFlashFrames = 0;
              }
              continue;
            }
            if (en.hitFlashFrames > 0) en.hitFlashFrames -= 1;

            if (en.kind === 'crawler') {
              en.x += en.vx * dt;
              if (Math.abs(en.vx) < 40) en.vx += en.facing * 90 * dt;
              if (en.x < 460) { en.x = 460; en.facing = 1; en.vx = 70; }
              if (en.x > canvas.width - 100) { en.x = canvas.width - 100; en.facing = -1; en.vx = -70; }
            } else if (en.kind === 'shieldbearer') {
              en.x += Math.sin(now * 0.002) * 36 * dt;
              en.facing = (player.x + 14) >= (en.x + en.w * 0.5) ? 1 : -1;
            } else if (en.kind === 'flyer') {
              en.y = en.homeY + Math.sin(now * 0.003) * 14;
              en.facing = (player.x + 14) >= (en.x + en.w * 0.5) ? 1 : -1;
            } else if (en.kind === 'warden') {
              en.y = en.homeY + Math.sin(now * 0.0025) * 10;
              en.facing = (player.x + 14) >= (en.x + en.w * 0.5) ? 1 : -1;
            }

            if (en.knockTimer > 0) {
              en.knockTimer = Math.max(0, en.knockTimer - dt);
              en.x += en.knockVx * dt;
              en.y += en.knockVy * dt;
              const decay = Math.pow(0.06, dt);
              en.knockVx *= decay;
              en.knockVy *= decay;
              en.x = Math.max(360, Math.min(canvas.width - en.w - 20, en.x));
              if (en.kind !== 'flyer' && en.kind !== 'warden') {
                en.y = floorY - en.h;
              } else {
                en.y = Math.min(floorY - en.h, Math.max(80, en.y));
              }
            }
          }

          for (const p of particles) {
            p.life -= dt;
            p.vy += 170 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
          }
          while (particles.length && particles[0].life <= 0) particles.shift();

          for (const ft of floatingTexts) {
            ft.life -= dt;
            ft.y += ft.vy * dt;
            ft.vy *= 0.94;
          }
          while (floatingTexts.length && floatingTexts[0].life <= 0) floatingTexts.shift();
        }

        pressed.clear();

        // Render
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const sx = shakeTime > 0 ? (Math.random() * 2 - 1) * shakeMag : 0;
        const sy = shakeTime > 0 ? (Math.random() * 2 - 1) * shakeMag : 0;

        ctx.save();
        ctx.translate(sx, sy);

        // Floor & Spikes
        ctx.fillStyle = '#0f2126';
        ctx.fillRect(0, floorY, canvas.width, 110);
        ctx.fillStyle = '#335c54';
        ctx.fillRect(0, floorY, canvas.width, 4);

        ctx.fillStyle = '#2d1e2f';
        for (let x = spikes.x; x < spikes.x + spikes.w; x += 18) {
          ctx.beginPath();
          ctx.moveTo(x, spikes.y + spikes.h);
          ctx.lineTo(x + 9, spikes.y);
          ctx.lineTo(x + 18, spikes.y + spikes.h);
          ctx.closePath();
          ctx.fill();
        }

        // Enemies (solid stark #ffffff flash for 3-4 frames on hit)
        for (const en of enemies) {
          if (!en.alive) continue;
          const isFlash = en.hitFlashFrames > 0;
          ctx.fillStyle = isFlash
            ? '#ffffff'
            : en.kind === 'warden'
              ? '#7c2d12'
              : en.kind === 'shieldbearer'
                ? '#3b4f54'
                : en.flyer
                  ? '#1e3a4c'
                  : '#264d42';
          ctx.fillRect(en.x, en.y, en.w, en.h);
          if (en.kind === 'shieldbearer') {
            ctx.fillStyle = isFlash ? '#ffffff' : '#94a3b8';
            ctx.fillRect(en.facing === 1 ? en.x + en.w - 6 : en.x - 2, en.y + 4, 8, en.h - 8);
          }
          ctx.fillStyle = '#071315';
          ctx.fillRect(en.x, en.y - 10, en.w, 5);
          ctx.fillStyle = en.kind === 'warden' ? '#fb923c' : '#52b788';
          ctx.fillRect(en.x, en.y - 10, en.w * (en.hp / en.maxHp), 5);
        }

        // Player
        ctx.fillStyle = player.dashTimer > 0 ? '#67e8f9' : '#264653';
        ctx.fillRect(player.x, player.y + 16, player.w, player.h - 16);
        ctx.fillStyle = '#f1f5f9';
        ctx.beginPath();
        ctx.arc(player.x + 14, player.y + 12, 12, 0, Math.PI * 2);
        ctx.fill();

        // 3-Frame Procedural Crescent Slash
        if (combat.slash.active) {
          const s = combat.slash;
          const f = s.frame;
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.dir === 'left' ? Math.PI : s.dir === 'up' ? -Math.PI / 2 : s.dir === 'down' ? Math.PI / 2 : 0);
          if (s.kind === 'comboHit2') ctx.scale(1, -1);
          ctx.globalAlpha = f === 0 ? 0.95 : f === 1 ? 1 : 0.45;
          ctx.fillStyle = s.kind === 'comboFinisher' ? '#fef08a' : s.kind === 'shadowDashAttack' ? '#c084fc' : '#ffffff';
          ctx.beginPath();
          ctx.arc(8, 0, s.radius * (f === 1 ? 1.06 : 0.96), -1.05, 1.05);
          ctx.arc(0, 0, s.radius * 0.78, 1.02, -1.02, true);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = s.kind === 'dashSlash' ? '#22d3ee' : s.kind === 'comboFinisher' ? '#f59e0b' : '#7ae7ff';
          ctx.lineWidth = f === 1 ? 4 : 2.5;
          ctx.beginPath();
          ctx.arc(10, 0, s.radius * 1.08, -1.0, 1.0);
          ctx.stroke();
          ctx.restore();
        }

        // AoE Rings & Slash Waves
        for (const r of combat.aoeRings) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, r.life / r.maxLife);
          ctx.strokeStyle = r.color;
          ctx.lineWidth = r.isUltimate ? 6 : 4;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        for (const w of combat.waves) {
          ctx.save();
          ctx.translate(w.x, w.y);
          ctx.scale(w.facing, 1);
          ctx.fillStyle = w.color;
          ctx.beginPath();
          ctx.arc(-16, 0, w.halfH, -1.05, 1.05);
          ctx.arc(-34, 0, w.halfH * 0.88, 1.0, -1.0, true);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Sparks & Directional Dust Particles (glowing + shrinking over time)
        for (const p of particles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          const rad = Math.max(0.5, p.size * (0.25 + 0.75 * alpha));
          if (p.glow) {
            ctx.globalAlpha = alpha * 0.35;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, rad * 2.1, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = alpha;
          ctx.fillStyle = alpha > 0.65 && p.glow ? '#ffffff' : p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.font = '700 14px system-ui, sans-serif';
        ctx.textAlign = 'center';
        for (const ft of floatingTexts) {
          ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        // Update HUD
        const curTier = LEVELS[player.level - 1];
        const nextTier = LEVELS[player.level] || null;
        const pct = nextTier ? Math.min(100, ((player.xp - curTier.xp) / (nextTier.xp - curTier.xp)) * 100) : 100;
        hudLevel.textContent = `Level ${player.level}: ${curTier.title}`;
        hudXpBar.style.width = `${pct}%`;
        hudSoul.textContent = `Soul: ${player.soul} / 100 · XP: ${player.xp}`;
        hudAttack.textContent = `Level ${combat.activeLevel} ${combat.activeName}`;

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
